brokerClusterName = CityLifeCluster
brokerName = citylife-broker
brokerId = 0

# NameServer 地址，按实际部署修改
namesrvAddr = 127.0.0.1:9876
brokerIP1 = 127.0.0.1
listenPort = 10911

deleteWhen = 04
fileReservedTime = 48
brokerRole = ASYNC_MASTER
flushDiskType = ASYNC_FLUSH

# 本地开发方便自动创建 Topic / 消费组；生产环境建议关闭并提前规划资源
autoCreateTopicEnable = true
autoCreateSubscriptionGroup = true
