server:
  port: 8081
spring:
  application:
    name: citylife
  datasource:
    driver-class-name: com.mysql.jdbc.Driver
    url: jdbc:mysql://127.0.0.1:3306/hmdp?useSSL=false&serverTimezone=UTC
    username: ${MYSQL_USERNAME:root}
    password: ${MYSQL_PASSWORD:change_me}
  redis:
    host: localhost
    port: 6379
    password: ${REDIS_PASSWORD:change_me}
    lettuce:
      pool:
        enabled: true
        max-active: 20
        max-idle: 10
        min-idle: 1
        time-between-eviction-runs: 10s
  jackson:
    default-property-inclusion: non_null
mybatis-plus:
  type-aliases-package: com.hmdp.entity
rocketmq:
  name-server: 127.0.0.1:9876
  producer:
    group: citylife-seckill-producer
    send-message-timeout: 3000
    retry-times-when-send-failed: 2
logging:
  level:
    com.hmdp: debug
    com.hmdp.mq: debug

# 秒杀相关配置
seckill:
  # 下单后多少分钟未支付自动关闭
  pay-timeout-minutes: 15
  # RocketMQ 消费失败/对账重投的最大次数（超过后进入 RocketMQ 死信或回滚库存）
  max-retry: 3
  # 对账任务扫描间隔
  reconcile-interval-ms: 60000
  # Redis outbox -> RocketMQ 转发器配置
  outbox:
    consumer-count: 1
    pending-idle-seconds: 60

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics
  endpoint:
    health:
      show-details: always
